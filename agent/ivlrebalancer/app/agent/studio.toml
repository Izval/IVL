[project]
name = "ivlrebalancer-agent"

[stack]
# Project-lifetime facts: which framework / runtime adapter recipes this
# Agent was scaffolded against. doctor / dev / deploy read these to know
# what to check, load, and route. framework: adk; runtime: agentcore | azure-foundry.
framework = "adk"
runtime = "agentcore"
# External protocol this runtime serves (one runtime, one signer):
#   A2A — serve_a2a: agent card + negotiate/notify_funded skills.
#   MCP — FastMCP on /mcp: negotiate (signed quote) + notify_funded (verify →
#         deliver → submit, synchronously within the tool call) + read-only chain
#         tools. MCP delivery runs in-call (≤ ~15 min); the runtime is stateful.
protocol = "A2A"

[network]
default = "bsc-mainnet"

[deploy]
# Deploy destination (orthogonal to [stack].runtime). 'platform' deploys
# through the BNB Chain managed platform as a 48h TESTNET TRIAL sandbox
# (auto-reclaimed at 48h), not a production seller. `bag deploy` dispatches
# on this; it records [deploy.platform] (slug/deployment_id/invoke_url)
# post-deploy. Absent ⇒ self (deploy to your own cloud via [stack].runtime).
# Self-deploy: registramos la identidad ERC-8004 PERMANENTE desde nuestra propia
# wallet fondeada (`bag erc8004 register` self-pays), no vía el trial gestionado de
# 48h. El deploy gestionado (A2A hosting) queda como paso opcional posterior:
# reactivar poniendo destination = "platform" antes de `bag deploy agent`.
# destination = "platform"
# Artifact channel: 'zip' (evm-local default — managed runtime, no Docker)
# or 'container' (local Docker build → brokered ECR; forced for twak).
platform_artifact = "zip"

[wallet]
# Local keystore signer. The Agent is the SOLE key-holder/signer.
# The keystore lives at the WORKSPACE root — outside app/agent (the AgentCore
# codeLocation) — so no packaging path can bundle it into a deploy artifact.
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
# MAINNET signer — DEDICATED agent wallet (NOT the personal wallet). Its keystore +
# WALLET_PASSWORD live on the server (Render secrets — NEVER committed), so it holds
# only limited funds. Funded from the personal wallet; ERC-8183 payments land here.
address = "0x6D19d43fC2cd226B135ED5f9F82b366AC864b703"

[llm]
provider = "anthropic"
model = "claude-sonnet-4-5"

[payments.erc8183]
# Read by the Agent: it quotes the FIXED `price`, CLAMPS it to [min,max],
# freezes a short-TTL offer, and EIP-191 signs it — pricing is rule-based, the
# LLM never prices.
currency = "0x55d398326f99059fF775485246999027B3197955"   # USDT (BSC-USD, 18 dec) on BSC mainnet
price = "1000000000000000000"                  # wei — list price = 1 USDT per rebalance (preview is free)
min_price = "0"                                # wei — clamp floor
max_price = "3000000000000000000"              # wei — clamp ceiling = 3 USDT
quote_ttl_seconds = 900                        # seconds a signed quote stays valid; SDK caps at 900 (~15min work window)
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false                            # opt-in: detect dispute-window-elapsed → settle

[storage]
# Deliverables written to local disk (file://). Offline-dev only —
# does NOT survive deploy. Path from STORAGE_LOCAL_PATH.
kind = "local"

